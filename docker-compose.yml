services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    networks: [appnet]
    volumes:
      - redisdata:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ROLE: web
    depends_on:
      - postgres
      - redis
    networks: [appnet]
    # Доступ к ModemManager на ХОСТЕ
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
      - /run/ModemManager:/run/ModemManager:ro
      - staticdata:/static
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ROLE: worker
      # Настройки для SMS watcher
      INBOX_DIR: /var/spool/gammu/inbox
      PROCESSED_DIR: /var/spool/gammu/processed
      LOOP_INTERVAL: 60
      SLEEP_BETWEEN_FILES: 0.5
      MAX_PER_ITERATION: 50
      ERROR_BACKOFF: 2
    depends_on:
      - postgres
      - redis
    networks: [appnet]
    # Gammu работает на хосте, поэтому доступ к /dev не нужен
    volumes:
      # Монтируем папки Gammu с хоста для SMS watcher
      - /var/spool/gammu/inbox:/var/spool/gammu/inbox
      - /var/spool/gammu/processed:/var/spool/gammu/processed
      - /var/spool/gammu/sent:/var/spool/gammu/sent
      - /var/spool/gammu/outbox:/var/spool/gammu/outbox
      - /var/spool/gammu/error:/var/spool/gammu/error
    restart: always

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ROLE: beat
    depends_on:
      - postgres
      - redis
    networks: [appnet]
    restart: always

  nginx:
    image: nginx:1.27
    depends_on:
      - web
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf
      - staticdata:/static:ro
    ports:
      - "80:80"
    networks: [appnet]
    restart: always


# Gammu smsd теперь работает на хосте, не в Docker
# Настройте gammu-smsd на хосте с конфигом:
# [gammu]
# device = /dev/ttyUSB1
# connection = at
# [smsd]
# service = files
# inboxpath = /var/spool/gammu/inbox
# outboxpath = /var/spool/gammu/outbox
# sentsmspath = /var/spool/gammu/sent
# errorsmspath = /var/spool/gammu/error

networks:
  appnet:

volumes:
  pgdata:
  redisdata:
  staticdata:
