services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    networks: [appnet]
    ports:
      - "6370:6379"
    volumes:
      - redisdata:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ROLE: web
    depends_on:
      - postgres
      - redis
    networks: [appnet]
    volumes:
      - staticdata:/static
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ROLE: worker
    depends_on:
      - postgres
      - redis
    networks: [appnet]
    restart: always

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ROLE: beat
    depends_on:
      - postgres
      - redis
    networks: [appnet]
    restart: always

  nginx:
    image: nginx:1.27
    depends_on:
      - web
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf
      - staticdata:/static:ro
    ports:
      - "80:80"
    networks: [appnet]
    restart: always


networks:
  appnet:

volumes:
  pgdata:
  redisdata:
  staticdata:
