version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    networks: [appnet]
    volumes:
      - redisdata:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ROLE: web
    depends_on:
      - postgres
      - redis
    networks: [appnet]
    # Доступ к ModemManager на ХОСТЕ
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
      - /run/ModemManager:/run/ModemManager:ro
      - staticdata:/static
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ROLE: worker
    depends_on:
      - postgres
      - redis
    networks: [appnet]
    # Тоже нужен доступ к ModemManager, если worker вызывает mmcli
    privileged: true             # самый простой способ разрешить доступ к /dev/*
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyUSB1:/dev/ttyUSB1
      - /dev/serial/by-id:/dev/serial/by-id
    security_opt:
      - apparmor=unconfined
    volumes:
      - gammu-spool:/var/spool/gammu:ro
    restart: always

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      ROLE: beat
    depends_on:
      - postgres
      - redis
    networks: [appnet]
    restart: always

  nginx:
    image: nginx:1.27
    depends_on:
      - web
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf
      - staticdata:/static:ro
    ports:
      - "80:80"
    networks: [appnet]
    restart: always


  smsd:
    build: ./gammu
    environment:
      MODEM_PORT: /dev/serial/by-id/usb-Technology_Mobile-if00-port0  # ← возьми нужный
      CONNECTION: at115200
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyUSB1:/dev/ttyUSB1
      - /dev/serial/by-id:/dev/serial/by-id
    privileged: true   # проще всего дать доступ к /dev/*
    volumes:
      - gammu-spool:/var/spool/gammu
    restart: always

networks:
  appnet:

volumes:
  pgdata:
  redisdata:
  staticdata:
